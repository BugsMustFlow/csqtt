name: Build CSQTT Server for NanoPi

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Cross-compiler tool
      run: |
        cargo install cross

    - name: Build release binary via Cross
      run: |
        cd rust-server
        cross build --release --target aarch64-unknown-linux-musl --bin csqtt

    - name: Upload compiled binary
      uses: actions/upload-artifact@v4
      with:
        name: csqtt-nanopi-binary
        path: rust-server/target/aarch64-unknown-linux-musl/release/csqtt
