name: Build CSQTT Server for NanoPi

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Скачиваем код из вашего репозитория
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Компилируем серверную часть в изолированном контейнере, предварительно очистив локальные конфиги
    - name: Build release binary via Rust-Musl-Cross Docker
      run: |
        # ИСПРАВЛЕНИЕ: Принудительно удаляем локальные файлы настроек тулчейна, чтобы избежать конфликта путей
        rm -f rust-toolchain.toml rust-toolchain .cargo/config.toml || true
        rm -f rust-server/rust-toolchain.toml rust-server/rust-toolchain rust-server/.cargo/config.toml || true
        
        # Запускаем проверенный контейнер, который теперь отработает в штатном режиме
        docker run --rm -v ${{ github.workspace }}:/home/rust/src -w /home/rust/src/rust-server messense/rust-musl-cross:aarch64-musl cargo build --release --bin csqtt

    # 3. Упаковываем готовый бинарник в ZIP-архив и выкладываем на страницу скачивания
    - name: Upload compiled binary
      uses: actions/upload-artifact@v4
      with:
        name: csqtt-nanopi-binary
        path: rust-server/target/aarch64-unknown-linux-musl/release/csqtt
