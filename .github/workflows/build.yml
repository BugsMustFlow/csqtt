name: Build CSQTT Server for NanoPi

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Скачиваем код из вашего репозитория
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Очищаем локальные файлы настроек тулчейна авторов
    - name: Clean local toolchains
      run: |
        rm -f rust-toolchain.toml rust-toolchain .cargo/config.toml || true
        rm -f rust-server/rust-toolchain.toml rust-server/rust-toolchain rust-server/.cargo/config.toml || true

    # 3. Устанавливаем официальный свежий Rust и добавляем целевой таргет для NanoPi
    - name: Set up latest Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-unknown-linux-musl

    # 4. Устанавливаем стабильный Zig 0.13.0 напрямую с официального сайта и плагин сборщика
    - name: Install Zig and Cargo-Zigbuild
      run: |
        wget https://ziglang.org
        tar -xf zig-linux-x86_64-0.17.0.tar.xz
        echo "$GITHUB_WORKSPACE/zig-linux-x86_64-0.17.0" >> $GITHUB_PATH
        cargo install cargo-zigbuild

    # 5. Компилируем серверную часть
    - name: Build release binary
      run: |
        cd rust-server
        cargo zigbuild --release --target aarch64-unknown-linux-musl --bin csqtt

    # 6. Упаковываем готовый бинарник в ZIP-архив и выкладываем на страницу скачивания
    - name: Upload compiled binary
      uses: actions/upload-artifact@v4
      with:
        name: csqtt-nanopi-binary
        path: rust-server/target/aarch64-unknown-linux-musl/release/csqtt
